var S=[[.30,.15,.20,.05,.20,.10],[.22,.10,.12,.38,.10,.08],[.28,.17,.15,.25,.09,.06]];
var cur="ky",tab=0,cu=0,sc=0,an=0;
function $(i){return document.getElementById(i)}
function cards(a){return a.map(function(x){return '<div class="item"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>'}).join("")}
function spec(){
var d=T[cur],u=d.use[tab];
$("spec").innerHTML=[1,2,3].map(function(k,i){return '<div><dt>'+d.lab[i]+'</dt><dd>'+u[k]+'</dd></div>'}).join("");
document.querySelectorAll("#tabs button").forEach(function(b,i){b.setAttribute("aria-selected",i===tab)});
}
function calc(){
var d=T[cur],b=+$("cb").value;
$("cu").innerHTML=d.use.map(function(x,i){return '<option value="'+i+'"'+(i===cu?' selected':'')+'>'+x[0]+'</option>'}).join("");
$("cbv").textContent="$"+b;
$("cres").innerHTML=d.parts.map(function(p,i){var v=S[cu][i];return '<div class="row"><span>'+p[0]+'</span><i style="--w:'+v*100+'%"></i><b>$'+Math.round(b*v)+'</b></div>'}).join("");
}
function gloss(){
var d=T[cur],q=$("gq").value.toLowerCase();
var r=d.gl.filter(function(x){return (x[0]+" "+x[1]).toLowerCase().indexOf(q)>-1});
$("gl").innerHTML=r.length?cards(r):'<p class="note">'+d.g_none+'</p>';
}
function quiz(){
var d=T[cur];sc=0;an=0;
$("qz").innerHTML=d.qz.map(function(q,i){return '<div class="qq"><h3>'+(i+1)+'. '+q[0]+'</h3>'+q[1].map(function(o,j){return '<button type="button" data-q="'+i+'" data-o="'+j+'">'+o+'</button>'}).join("")+'</div>'}).join("")+'<p id="qr"></p>';
}
$("qz").addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;
var box=b.parentNode;if(box.getAttribute("data-done"))return;
var q=T[cur].qz[+b.getAttribute("data-q")],o=+b.getAttribute("data-o"),bs=box.querySelectorAll("button");
box.setAttribute("data-done","1");an++;
if(o===q[2]){sc++;b.className="ok"}else{b.className="bad";bs[q[2]].className="ok"}
if(an===T[cur].qz.length)$("qr").textContent=T[cur].q_ok+sc+"/"+an;
});
$("cu").addEventListener("change",function(){cu=+this.value;calc()});
$("cb").addEventListener("input",calc);
$("gq").addEventListener("input",gloss);
function setLang(l){
var d=T[l];if(!d)return;cur=l;
document.documentElement.lang=l;document.title=d.title;
document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=d[e.getAttribute("data-i")]});
document.querySelectorAll("[data-lang]").forEach(function(b){b.setAttribute("aria-pressed",b.getAttribute("data-lang")===l)});
$("steps").innerHTML=d.steps.map(function(x){return '<li><h3>'+x[0]+'</h3><p>'+x[1]+'</p></li>'}).join("");
$("parts-list").innerHTML=cards(d.parts);$("types-list").innerHTML=cards(d.types);$("os-list").innerHTML=cards(d.os);$("tips-list").innerHTML=cards(d.tips);
$("faq-list").innerHTML=d.faq.map(function(x){return '<details><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>'}).join("");
$("tabs").innerHTML=d.use.map(function(x,i){return '<button type="button" role="tab" data-t="'+i+'">'+x[0]+'</button>'}).join("");
document.querySelectorAll("#tabs button").forEach(function(b){b.addEventListener("click",function(){tab=+b.getAttribute("data-t");spec()})});
$("gq").placeholder=d.g_ph;
spec();calc();gloss();quiz();
try{localStorage.setItem("aisnet-lang",l)}catch(e){}
}
document.querySelectorAll("[data-lang]").forEach(function(b){b.addEventListener("click",function(){setLang(b.getAttribute("data-lang"))})});
$("theme").addEventListener("click",function(){
var r=document.documentElement,t=r.getAttribute("data-theme");
var dark=t?t==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
var n=dark?"light":"dark";r.setAttribute("data-theme",n);
try{localStorage.setItem("aisnet-theme",n)}catch(e){}
});
window.addEventListener("scroll",function(){
var h=document.documentElement,m=h.scrollHeight-h.clientHeight;
$("prog").style.width=(m>0?h.scrollTop/m*100:0)+"%";
},{passive:true});
var s="ky";try{s=localStorage.getItem("aisnet-lang")||"ky";var th=localStorage.getItem("aisnet-theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}
setLang(T[s]?s:"ky");
